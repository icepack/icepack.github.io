on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  nikola_build:
    runs-on: ubuntu-latest
    container:
      image: docker.io/firedrakeproject/firedrake-vanilla-default:2026.4.2
      options: --user root
    name: "Deploy Nikola to GitHub Pages"
    steps:
    - name: Checkout icepack source
      uses: actions/checkout@v5
      with:
        repository: icepack/icepack
        path: icepack
    - name: Install icepack and dependencies
      run: |
        apt update && apt install -yq patchelf graphviz moreutils jq libglue1-mesa-dev libxft2-dev
        pip3 install jupyter nbconvert netCDF4 siphash24
        pip3 install "Nikola[extras]"
        pip3 install --editable ./icepack
    - name: Create jupyter kernel
      run: python3 -m ipykernel install --user --name=firedrake
    - name: Checkout website source
      uses: actions/checkout@v4
      with:
        path: website
    - name: Preparing
      working-directory: ./website
      run: |
        src_branch=$(python3 -c 'import conf; print(conf.GITHUB_SOURCE_BRANCH)')
        dest_branch=$(python3 -c 'import conf; print(conf.GITHUB_DEPLOY_BRANCH)')
        git remote add ghpages "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" || true
        git fetch ghpages $dest_branch || true
        git checkout -b $dest_branch --track ghpages/$dest_branch || true
        git pull ghpages $dest_branch || true
        git checkout $src_branch
        printf '\n\nGITHUB_REMOTE_NAME = "ghpages"\nGITHUB_COMMIT_SOURCE = False\n' >> conf.py
    - name: Execute notebooks
      working-directory: ./website
      env:
        AKPYTHON_EXEC_IMPORT_UNAVAILABLE: 1  # TODO: try to remove this
        EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
        EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
      run: |
        python3 fetch_data.py
        make all --jobs $(nproc --all)
    - name: Publish
      working-directory: ./website
      run: |
        nikola github_deploy
